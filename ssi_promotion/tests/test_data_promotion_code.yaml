options:
  auto_refresh: true

scenarios:
  - name: "Create promotion code in draft"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Draft Voucher Type"
          code: "/"
          discount_type: "fixed"
          discount_amount: 15000.0
          usage_limit: 3
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "DRAFT-001"
          type_id: "EVAL: registry['ptype'].id"
      - step: "Assert created in draft"
        action: "assert"
        target: "code"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          voucher_code:
            type: "value"
            expected: "DRAFT-001"
          state:
            type: "value"
            expected: "draft"

  - name: "Create promotion code with referrer partner"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Referral Voucher Type"
          code: "/"
          discount_type: "fixed"
          discount_amount: 20000.0
      - step: "Create referrer partner"
        action: "create"
        model: "res.partner"
        save_as: "referrer"
        values:
          name: "Referrer Partner"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "REF-001"
          type_id: "EVAL: registry['ptype'].id"
          partner_id: "EVAL: registry['referrer'].id"
      - step: "Assert referrer set"
        action: "assert"
        target: "code"
        asserts:
          partner_id:
            type: "value"
            operator: "is_truthy"

  - name: "Workflow draft to open via approval"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Workflow Voucher Type"
          code: "/"
          discount_type: "fixed"
          discount_amount: 25000.0
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "WF-001"
          type_id: "EVAL: registry['ptype'].id"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Assert sequence number assigned"
        action: "assert"
        target: "code"
        asserts:
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

  - name: "Workflow open to done"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Done Voucher Type"
          code: "/"
          discount_type: "fixed"
          discount_amount: 12000.0
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "DONE-001"
          type_id: "EVAL: registry['ptype'].id"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Mark done"
        action: "call"
        target: "code"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Cancel promotion code from draft"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Cancel Voucher Type"
          code: "/"
          discount_type: "fixed"
          discount_amount: 8000.0
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "CANCEL-001"
          type_id: "EVAL: registry['ptype'].id"
      - step: "Cancel promotion code"
        action: "call"
        target: "code"
        method: "action_cancel"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "cancel"

  - name: "Onchange type_id sets discount and usage limit"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Fixed Voucher"
          code: "/"
          discount_type: "fixed"
          discount_amount: 10000.0
          usage_limit: 5
      - step: "Fill form and check discount/limit onchange"
        action: "form"
        model: "promotion_code"
        save: false
        values:
          voucher_code: "ONCHANGE-001"
          type_id: "REC: ptype"
        asserts:
          discount_type:
            type: "value"
            expected: "fixed"
          discount_amount:
            type: "value"
            expected: 10000.0
          usage_limit:
            type: "value"
            expected: 5

  - name: "Onchange date_end computed from date_start and validity duration"
    steps:
      - step: "Create promotion type with validity period"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Validity Voucher"
          code: "/"
          discount_type: "fixed"
          discount_amount: 5000.0
          has_validity: true
          validity_duration: 30
      - step: "Fill form and check date_end onchange"
        action: "form"
        model: "promotion_code"
        save: false
        values:
          voucher_code: "ONCHANGE-002"
          date_start: 2024-07-01
          type_id: "REC: ptype"
        asserts:
          date_end:
            type: "value"
            expected: 2024-07-31
