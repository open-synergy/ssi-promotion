options:
  auto_refresh: true

scenarios:
  - name: "Create promotion code in draft"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Draft Voucher Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 15000.0
          usage_limit: 3
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "DRAFT-001"
          type_id: "EVAL: registry['ptype'].id"
      - step: "Assert created in draft"
        action: "assert"
        target: "code"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "DRAFT-001"
          state:
            type: "value"
            expected: "draft"

  - name: "Create promotion code with referrer partner"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Referral Voucher Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 20000.0
      - step: "Create referrer partner"
        action: "create"
        model: "res.partner"
        save_as: "referrer"
        values:
          name: "Referrer Partner"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "REF-001"
          type_id: "EVAL: registry['ptype'].id"
          partner_id: "EVAL: registry['referrer'].id"
      - step: "Assert referrer set"
        action: "assert"
        target: "code"
        asserts:
          partner_id:
            type: "value"
            operator: "is_truthy"

  - name: "Workflow draft to open via approval"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Workflow Voucher Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 25000.0
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "WF-001"
          type_id: "EVAL: registry['ptype'].id"
          # WAJIB: record rule promotion_code_internal_user_rule hanya
          # meloloskan pemiliknya sendiri; tanpa ini record mewarisi
          # superuser lewat _default_user_id() dan step ber-as_user di
          # bawah gagal AccessError begitu auto_refresh membacanya ulang
          # (jebakan T-05, skill odoo-development-unit-test).
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Assert sequence number assigned"
        action: "assert"
        target: "code"
        asserts:
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

  - name: "Workflow open to done"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Done Voucher Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 12000.0
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "DONE-001"
          type_id: "EVAL: registry['ptype'].id"
          # WAJIB: lihat catatan T-05 di skenario "Workflow draft to open
          # via approval" di atas.
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Refresh code before done (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Mark done"
        action: "call"
        target: "code"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Cancel promotion code from draft"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Cancel Voucher Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 8000.0
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "CANCEL-001"
          type_id: "EVAL: registry['ptype'].id"
          # WAJIB: lihat catatan T-05 di skenario "Workflow draft to open
          # via approval" di atas.
          user_id: "REF: base.user_admin"
      - step: "Cancel promotion code"
        action: "call"
        target: "code"
        method: "action_cancel"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "cancel"

  - name: "Onchange type_id sets discount and usage limit"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Fixed Voucher"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 10000.0
          usage_limit: 5
      - step: "Fill form and check discount/limit onchange"
        action: "form"
        model: "promotion_code"
        save: false
        # No document number here: on an unsaved Form, ``policy_template_id``
        # is never set (it is only assigned inside the ORM ``create()``
        # override, mixin_policy.py), so ``manual_number_ok`` computes
        # False and ``name`` stays readonly for the whole life of this
        # Form -- unrelated to the onchange under test.
        values:
          type_id: "REC: ptype"
        asserts:
          discount_type:
            type: "value"
            expected: "fixed"
          discount_amount:
            type: "value"
            expected: 10000.0
          usage_limit:
            type: "value"
            expected: 5

  - name: "Onchange date_end computed from date_start and validity duration"
    steps:
      - step: "Create promotion type with validity period"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Validity Voucher"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 5000.0
          has_validity: true
          validity_duration: 30
      - step: "Fill form and check date_end onchange"
        action: "form"
        model: "promotion_code"
        save: false
        # No document number here: see "Onchange type_id sets discount
        # and usage limit" above for why ``name`` stays readonly on an
        # unsaved Form.
        values:
          date_start: 2024-07-01
          type_id: "REC: ptype"
        asserts:
          date_end:
            type: "value"
            expected: 2024-07-31

  - name: "Create promotion code inherits referrer discount from type"
    steps:
      - step: "Create promotion type with own referrer discount rule"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Referrer Fixed Voucher Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 350000.0
          referrer_discount_type: "fixed"
          referrer_discount_amount: 150000.0
      - step: "Create promotion code without referrer values"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "REFDISC-001"
          type_id: "REC: ptype.id"
      - step: "Assert referrer discount inherited from type"
        action: "assert"
        target: "code"
        asserts:
          referrer_discount_type:
            type: "value"
            expected: "fixed"
          referrer_discount_amount:
            type: "value"
            expected: 150000.0
          discount_amount:
            type: "value"
            expected: 350000.0
      - step: "Create promotion code with explicit referrer amount"
        action: "create"
        model: "promotion_code"
        save_as: "code_explicit"
        values:
          name: "REFDISC-002"
          type_id: "REC: ptype.id"
          referrer_discount_amount: 175000.0
      - step: "Assert explicit referrer amount is not overridden"
        action: "assert"
        target: "code_explicit"
        asserts:
          referrer_discount_amount:
            type: "value"
            expected: 175000.0

  - name: "Onchange type_id sets referrer discount fields"
    steps:
      - step: "Create promotion type with percentage referrer discount"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Referrer Percentage Voucher Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 400000.0
          referrer_discount_type: "percentage"
          referrer_discount_percentage: 7.5
      - step: "Fill form and check referrer discount onchange"
        action: "form"
        model: "promotion_code"
        save: false
        # No document number here: see "Onchange type_id sets discount
        # and usage limit" above for why ``name`` stays readonly on an
        # unsaved Form.
        values:
          type_id: "REC: ptype"
        asserts:
          referrer_discount_type:
            type: "value"
            expected: "percentage"
          referrer_discount_percentage:
            type: "value"
            expected: 7.5
          referrer_discount_amount:
            type: "value"
            expected: 0.0
