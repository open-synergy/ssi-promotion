  - name: "action_populate_allocation skips a fully reconciled journal item"
    steps:
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "recv_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "POPAL-S3-INC"
          name: "Populate Allocation Filter Income"
          user_type_id: "REC: acc_type.id"
      - step: "Create a reconcilable receivable account"
        action: "create"
        model: "account.account"
        save_as: "recv_account"
        values:
          code: "POPAL-S3-RECV"
          name: "Populate Allocation Filter Receivable"
          user_type_id: "REC: recv_type.id"
          reconcile: true
      - step: "Create the reference document's own journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Populate Allocation Filter Journal"
          code: "POPALS3"
          type: "general"
      - step: "Create the settlement entry's own journal"
        action: "create"
        model: "account.journal"
        save_as: "misc_journal"
        values:
          name: "Populate Allocation Filter Misc Journal"
          code: "POPALS3M"
          type: "general"
      - step: "Create credit note product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Populate Allocation Filter Product"
          type: "service"
          property_account_income_id: "REC: income_account.id"
      - step: "Find account.move model"
        action: "search"
        model: "ir.model"
        domain: [["model", "=", "account.move"]]
        save_as: "account_move_model"
        limit: 1
        expect_count: 1
      - step: "Create promotion type allowing account.move as reference"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Populate Allocation Filter Type"
          code: "/"
          discount_type: "fixed"
          discount_amount: 50000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
          allowed_model_ids:
            - - 6
              - 0
              - - "REC: account_move_model.id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Populate Allocation Filter Customer"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "POPALS3-001"
          type_id: "REC: ptype.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create the reference document with two receivable lines"
        action: "create"
        model: "account.move"
        save_as: "document"
        values:
          move_type: "entry"
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: recv_account.id"
                partner_id: "REC: customer.id"
                name: "Populate Allocation Filter Line Paid"
                debit: 300000.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: recv_account.id"
                partner_id: "REC: customer.id"
                name: "Populate Allocation Filter Line Residual"
                debit: 200000.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: income_account.id"
                name: "Populate Allocation Filter Balance"
                debit: 0.0
                credit: 500000.0
      - step: "Post the reference document"
        action: "call"
        target: "document"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the line to be paid off"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: document.id"],
            ["name", "=", "Populate Allocation Filter Line Paid"],
          ]
        save_as: "move_line_paid"
        limit: 1
        expect_count: 1
      - step: "Find the line that should keep its residual"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: document.id"],
            ["name", "=", "Populate Allocation Filter Line Residual"],
          ]
        save_as: "move_line_residual"
        limit: 1
        expect_count: 1
      - step: "Create the settlement entry offsetting the first line"
        action: "create"
        model: "account.move"
        save_as: "settlement"
        values:
          move_type: "entry"
          journal_id: "REC: misc_journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: recv_account.id"
                partner_id: "REC: customer.id"
                name: "Populate Allocation Filter Settlement"
                debit: 0.0
                credit: 300000.0
            - - 0
              - 0
              - account_id: "REC: income_account.id"
                name: "Populate Allocation Filter Settlement Balance"
                debit: 300000.0
                credit: 0.0
      - step: "Post the settlement entry"
        action: "call"
        target: "settlement"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the settlement's own offsetting line"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: settlement.id"],
            ["name", "=", "Populate Allocation Filter Settlement"],
          ]
        save_as: "settle_line"
        limit: 1
        expect_count: 1
      - step: "Find both lines to reconcile against each other"
        action: "search"
        model: "account.move.line"
        domain: [["id", "in", ["REC: move_line_paid.id", "REC: settle_line.id"]]]
        save_as: "reconcile_pair"
        expect_count: 2
      - step: "Reconcile the paid line against the settlement"
        action: "call"
        target: "reconcile_pair"
        method: "reconcile"
        as_user: "base.user_admin"
      - step: "Assert the paid line has no residual left"
        action: "assert"
        target: "move_line_paid"
        asserts:
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "Assert the other line still has its residual"
        action: "assert"
        target: "move_line_residual"
        asserts:
          amount_residual:
            type: "value"
            expected: 200000.0
      - step: "Create a draft usage referencing the document"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          user_id: "REF: base.user_admin"
          document_reference: "EVAL: 'account.move,%d' % registry['document'].id"
      - step: "Run Populate Allocation"
        action: "call"
        target: "usage"
        method: "action_populate_allocation"
        as_user: "base.user_admin"
      - step: "Only the still-outstanding line becomes an allocation row"
        action: "search"
        model: "promotion_code_usage_allocation"
        domain: [["usage_id", "=", "REC: usage.id"]]
        save_as: "alloc_rows"
        expect_count: 1
      - step: "Assert the allocation row targets the residual line"
        action: "assert"
        target: "alloc_rows"
        asserts:
          move_line_id:
            type: "m2o"
            expected: "REC: move_line_residual"

