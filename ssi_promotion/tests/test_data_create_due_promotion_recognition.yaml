options:
  auto_refresh: true
scenarios:
  - name: "Prefill on open, onchange refresh, and empty-selection guard"
    steps:
      - step: "Get main company"
        action: "ref"
        xml_id: "base.main_company"
        save_as: "company"
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Get current assets account type"
        action: "ref"
        xml_id: "account.data_account_type_current_assets"
        save_as: "deferred_acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "CDPR-INC1"
          name: "Create Due Recognition Income 1"
          user_type_id: "REC: acc_type.id"
      - step: "Create deferred account"
        action: "create"
        model: "account.account"
        save_as: "deferred_account"
        values:
          code: "CDPR-DEF1"
          name: "Create Due Recognition Deferred Asset 1"
          user_type_id: "REC: deferred_acc_type.id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Create Due Recognition Sales Journal 1"
          code: "CDPRJ1"
          type: "sale"
          company_id: "REC: company.id"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Create Due Recognition Product 1"
          type: "service"
          property_account_income_id: "REC: income_account.id"
      - step: "Create deferred promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Create Due Recognition Deferred Type 1"
          code: "/"
          discount_usage_id: "REF: ssi_product_usage_account_type.product_usage_type_income"
          account_id: "REC: income_account.id"
          discount_type: "fixed"
          discount_amount: 4000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
          recognition_method: "deferred"
          deferred_account_id: "REC: deferred_account.id"
          recognition_journal_id: "REC: journal.id"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "CDPR-001"
          type_id: "REC: ptype.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Create Due Recognition Customer"
      - step: "Create first due deferred usage"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage_due_1"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          date: "EVAL: date.today() - timedelta(days=30)"
          deferred_account_id: "REC: deferred_account.id"
          recognition_journal_id: "REC: journal.id"
          recognition_date: "EVAL: date.today() - timedelta(days=1)"
          user_id: "REF: base.user_admin"
      - step: "Confirm first due usage"
        action: "call"
        target: "usage_due_1"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve first due usage"
        action: "call"
        target: "usage_due_1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
          recognition_state:
            type: "value"
            expected: "pending"
      - step: "Create second due deferred usage"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage_due_2"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          date: "EVAL: date.today() - timedelta(days=20)"
          deferred_account_id: "REC: deferred_account.id"
          recognition_journal_id: "REC: journal.id"
          recognition_date: "EVAL: date.today() - timedelta(days=2)"
          user_id: "REF: base.user_admin"
      - step: "Confirm second due usage"
        action: "call"
        target: "usage_due_2"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve second due usage"
        action: "call"
        target: "usage_due_2"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          recognition_state:
            type: "value"
            expected: "pending"
      - step: "Create a not-yet-due deferred usage"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage_future"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          date: "EVAL: date.today() - timedelta(days=5)"
          deferred_account_id: "REC: deferred_account.id"
          recognition_journal_id: "REC: journal.id"
          recognition_date: "EVAL: date.today() + timedelta(days=5)"
          user_id: "REF: base.user_admin"
      - step: "Confirm not-yet-due usage"
        action: "call"
        target: "usage_future"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve not-yet-due usage"
        action: "call"
        target: "usage_future"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          recognition_state:
            type: "value"
            expected: "pending"
      - step: "Create an Immediate usage on the same deferred type"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage_immediate"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          date: "EVAL: date.today() - timedelta(days=1)"
          recognition_method: "immediate"
        as_user: "base.user_admin"
      - step: "Confirm the Immediate usage"
        action: "call"
        target: "usage_immediate"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve the Immediate usage"
        action: "call"
        target: "usage_immediate"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          recognition_state:
            type: "value"
            expected: "not_applicable"
      - step: "Create a third due deferred usage, to be fully recognized"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage_done"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          date: "EVAL: date.today() - timedelta(days=15)"
          deferred_account_id: "REC: deferred_account.id"
          recognition_journal_id: "REC: journal.id"
          recognition_date: "EVAL: date.today() - timedelta(days=3)"
          user_id: "REF: base.user_admin"
      - step: "Confirm the to-be-recognized usage"
        action: "call"
        target: "usage_done"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve the to-be-recognized usage"
        action: "call"
        target: "usage_done"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          recognition_state:
            type: "value"
            expected: "pending"
      - step: "Create the full recognition for usage_done"
        action: "create"
        model: "promotion_code_usage_recognition"
        save_as: "recognition_done"
        values:
          usage_id: "REC: usage_done.id"
          date: "EVAL: date.today()"
          amount: 4000.0
          journal_id: "REC: journal.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm the full recognition"
        action: "call"
        target: "recognition_done"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve the full recognition"
        action: "call"
        target: "recognition_done"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"
      - step: "Assert usage_done is now fully recognized"
        action: "assert"
        target: "usage_done"
        refresh: true
        asserts:
          recognition_state:
            type: "value"
            expected: "recognized"
      - step: "Open the wizard fresh -- usage_ids prefilled automatically"
        action: "create"
        model: "create_due_promotion_recognition"
        save_as: "wizard"
        as_user: "base.user_admin"
        values: {}
      - step: "Assert only the two due usages were caught, as of today"
        action: "assert"
        target: "wizard"
        asserts:
          date:
            type: "value"
            expected: "EVAL: date.today()"
          usage_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: usage_due_1"
              - "REC: usage_due_2"
      - step: "Changing Date in the form refreshes usage_ids"
        # NB: cannot use `values:` + top-level `asserts:` with
        # `type: "m2m", check: "exact"` here -- odoo-yaml-test's
        # `_coerce_to_ids` only understands recordsets / list / tuple /
        # set, and an unsaved Form's m2m field is Odoo's `M2MProxy`
        # (a `collections.abc.Sequence`, no `.ids` attribute), so it
        # raises "Cannot interpret <M2MProxy> as a record reference".
        # `check: "count"` (uses plain `len()`) and `operator: "contains"`
        # (uses `in`, backed by `M2MProxy.__contains__`) both work on an
        # unsaved Form, so the same exact-set assertion is reconstructed
        # as a count check plus one containment check per expected
        # record via `ops:`.
        action: "form"
        model: "create_due_promotion_recognition"
        save: false
        as_user: "base.user_admin"
        ops:
          - set:
              date: "EVAL: date.today() + timedelta(days=5)"
          - assert:
              usage_ids:
                type: "m2m"
                check: "count"
                expected_count: 3
          - assert:
              usage_ids:
                type: "value"
                operator: "contains"
                expected: "REC: usage_due_1"
          - assert:
              usage_ids:
                type: "value"
                operator: "contains"
                expected: "REC: usage_due_2"
          - assert:
              usage_ids:
                type: "value"
                operator: "contains"
                expected: "REC: usage_future"
      - step: "Open the wizard on a Date that catches nothing"
        action: "form"
        model: "create_due_promotion_recognition"
        save: true
        save_as: "wizard_empty"
        as_user: "base.user_admin"
        values:
          date: "EVAL: date.today() - timedelta(days=3650)"
        asserts:
          usage_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
      - step: "Running the wizard with no Usage selected is rejected"
        action: "call"
        target: "wizard_empty"
        method: "action_create_due_recognition"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "No Usage is due for recognition"
