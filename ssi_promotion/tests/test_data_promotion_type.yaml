scenarios:
  - name: "Create promotion type with fixed discount"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Fixed Voucher"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 10000.0
          usage_limit: 5
      - step: "Assert created"
        action: "assert"
        target: "ptype"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          discount_type:
            type: "value"
            expected: "fixed"
          discount_amount:
            type: "value"
            expected: 10000.0
          usage_limit:
            type: "value"
            expected: 5

  - name: "Create promotion type with percentage discount"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Percentage Voucher"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "percentage"
          discount_percentage: 10.0
      - step: "Assert created"
        action: "assert"
        target: "ptype"
        asserts:
          discount_type:
            type: "value"
            expected: "percentage"
          discount_percentage:
            type: "value"
            expected: 10.0

  - name: "Create promotion type with validity and python code"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Python Voucher"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "python"
          discount_python_code: "result = 5000"
          has_validity: true
          validity_duration: 30
          validity_python_code: "result = True"
      - step: "Assert created"
        action: "assert"
        target: "ptype"
        asserts:
          discount_type:
            type: "value"
            expected: "python"
          has_validity:
            type: "value"
            expected: true
          validity_duration:
            type: "value"
            expected: 30

  - name: "Edit promotion type name"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Original Name"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
      - step: "Write new name"
        action: "write"
        target: "ptype"
        values:
          name: "Updated Name"
      - step: "Assert name updated"
        action: "assert"
        target: "ptype"
        asserts:
          name:
            type: "value"
            expected: "Updated Name"

  - name: "Delete promotion type"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "To Be Deleted"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
      - step: "Delete record"
        action: "call"
        target: "ptype"
        method: "unlink"
      - step: "Verify deleted"
        action: "search"
        model: "promotion_type"
        domain: [["name", "=", "To Be Deleted"]]
        save_as: "result"
        expect_count: 0

  # Backward compatibility guard: a promotion type created without any
  # referrer discount setting must keep granting the referrer exactly what
  # the voucher user gets. Do not delete this scenario.
  - name: "Create promotion type without referrer discount rule"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "No Referrer Rule Voucher"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 350000.0
      - step: "Assert referrer discount defaults to same as customer"
        action: "assert"
        target: "ptype"
        asserts:
          referrer_discount_type:
            type: "value"
            expected: "same"
          referrer_discount_amount:
            type: "value"
            expected: 0.0
          referrer_discount_percentage:
            type: "value"
            expected: 0.0

  # Backward compatibility guard: a promotion type created without any
  # referrer recognition setting must keep the referrer following the voucher
  # user's own recognition rule. Do not delete this scenario.
  - name: "Create promotion type without referrer recognition rule"
    steps:
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "No Referrer Recognition Rule Voucher"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 275000.0
      - step: "Assert referrer recognition defaults to same as customer"
        action: "assert"
        target: "ptype"
        asserts:
          referrer_recognition_method:
            type: "value"
            expected: "same"
          referrer_deferred_account_id:
            type: "value"
            operator: "is_falsy"
          referrer_recognition_journal_id:
            type: "value"
            operator: "is_falsy"

  - name: "Create promotion type with its own referrer recognition rule"
    steps:
      - step: "Get current assets account type"
        action: "ref"
        xml_id: "account.data_account_type_current_assets"
        save_as: "deferred_acc_type"
      - step: "Create referrer deferred account"
        action: "create"
        model: "account.account"
        save_as: "referrer_deferred_account"
        values:
          code: "PROMO-RDEF-TYPE"
          name: "Promotion Referrer Deferred Type Account"
          user_type_id: "REC: deferred_acc_type.id"
      - step: "Create referrer recognition journal"
        action: "create"
        model: "account.journal"
        save_as: "referrer_recognition_journal"
        values:
          name: "Promotion Referrer Recognition Type Journal"
          code: "RDEFT"
          type: "general"
          company_id: "REC: company.id"
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Referrer Deferred Voucher"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          discount_type: "fixed"
          discount_amount: 90000.0
          referrer_recognition_method: "deferred"
          referrer_deferred_account_id: "REC: referrer_deferred_account.id"
          referrer_recognition_journal_id: "REC: referrer_recognition_journal.id"
      - step: "Assert referrer recognition rule stored apart from customer side"
        action: "assert"
        target: "ptype"
        asserts:
          referrer_recognition_method:
            type: "value"
            expected: "deferred"
          referrer_deferred_account_id:
            type: "m2o"
            expected: "REC: referrer_deferred_account"
          referrer_recognition_journal_id:
            type: "m2o"
            expected: "REC: referrer_recognition_journal"
          recognition_method:
            type: "value"
            expected: "immediate"
          deferred_account_id:
            type: "value"
            operator: "is_falsy"
