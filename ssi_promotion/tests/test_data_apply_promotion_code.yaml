      - step: "A code handed over in the context is derived by the default itself"
        action: "form"
        model: "apply_promotion_code"
        as_user: "base.user_admin"
        save: false
        context:
          active_model: "account.move"
          active_id: "REC: referrer_invoice.id"
          default_promotion_code_id: "REC: code_ref.id"
        asserts:
          promotion_code_id:
            type: "m2o"
            expected: "REC: code_ref"
          side:
            type: "value"
            expected: "referrer"
      - step: "A document without the mixin derives Voucher User, it does not raise"
        action: "form"
        model: "apply_promotion_code"
        as_user: "base.user_admin"
        save: false
        context:
          active_model: "res.partner"
          active_id: "REC: referrer.id"
        ops:
          - set: {promotion_code_id: "REC: code_ref"}
          - assert:
              side:
                type: "value"
                expected: "customer"
