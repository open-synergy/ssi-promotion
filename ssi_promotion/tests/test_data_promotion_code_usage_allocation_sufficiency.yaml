options:
  auto_refresh: true

scenarios:
  - name: "Approving a usage whose customer allocation is too small is rejected"
    steps:
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "SUFF-S1-INC"
          name: "Sufficiency Customer Short Income"
          user_type_id: "REC: acc_type.id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Sufficiency Customer Short Journal"
          code: "SUFF1"
          type: "sale"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Sufficiency Customer Short Product"
          type: "service"
          property_account_income_id: "REC: income_account.id"
      - step: "Create promotion type granting a 350000 discount"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Sufficiency Customer Short Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          account_id: "REC: income_account.id"
          discount_type: "fixed"
          discount_amount: 350000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Sufficiency Customer Short Customer"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "SUFF-S1-001"
          type_id: "REC: ptype.id"
          discount_amount: 350000.0
          # WAJIB: record rule promotion_code_internal_user_rule hanya
          # meloloskan pemiliknya sendiri (jebakan T-05).
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create a posted receivable invoice of only 67500"
        action: "create"
        model: "account.move"
        save_as: "invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: customer.id"
          journal_id: "REC: journal.id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                quantity: 1
                price_unit: 67500.0
                name: "Sufficiency Customer Short Invoice Line"
                account_id: "REC: income_account.id"
      - step: "Post the invoice"
        action: "call"
        target: "invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the invoice's own receivable line"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: invoice.id"],
            ["account_id.internal_type", "=", "receivable"],
          ]
        save_as: "move_line"
        limit: 1
        expect_count: 1
      - step: "Assert the receivable line only carries 67500 of residual"
        action: "assert"
        target: "move_line"
        asserts:
          amount_residual:
            type: "value"
            expected: 67500.0
      - step: "Create usage allocating that single short receivable line"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          # WAJIB: lihat catatan T-05 di atas.
          user_id: "REF: base.user_admin"
          allocation_ids:
            - - 0
              - 0
              - sequence: 10
                source: "customer"
                move_line_id: "REC: move_line.id"
      - step: "Assert the usage grants the full 350000 discount"
        action: "assert"
        target: "usage"
        asserts:
          discount_amount:
            type: "value"
            expected: 350000.0
      - step: "Confirm usage"
        action: "call"
        target: "usage"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh usage before approval (fresh policy field read)"
        action: "assert"
        target: "usage"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approving names the side, the available residual, and the discount"
        action: "call"
        target: "usage"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains:
            "Source 'Voucher User' only offer 67500.0 of residual amount, which is less
            than that side's own discount amount of 350000.0"
      - step: "Assert the usage stayed in Confirm without an accounting entry"
        action: "assert"
        target: "usage"
        asserts:
          state:
            type: "value"
            expected: "confirm"
          move_id:
            type: "value"
            operator: "is_falsy"
      - step: "Assert no journal entry was created for the customer at all"
        action: "search"
        model: "account.move"
        domain: [["move_type", "=", "entry"], ["partner_id", "=", "REC: customer.id"]]
        save_as: "customer_entries"
        expect_count: 0

