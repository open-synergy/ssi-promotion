        values:
          name: "Allocation Negative Partner Type"
          code: "/"
          discount_type: "fixed"
          discount_amount: 50000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
      - step: "Create voucher user partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Allocation Negative Partner Voucher User"
      - step: "Create an unrelated partner"
        action: "create"
        model: "res.partner"
        save_as: "other_partner"
        values:
          name: "Allocation Negative Unrelated Partner"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "ALLOC-NEG1-001"
          type_id: "REC: ptype.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create a posted receivable invoice for the OTHER partner"
        action: "create"
        model: "account.move"
        save_as: "invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: other_partner.id"
          journal_id: "REC: journal.id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                quantity: 1
                price_unit: 300000.0
                name: "Allocation Negative Partner Invoice Line"
                account_id: "REC: income_account.id"
      - step: "Post the invoice"
        action: "call"
        target: "invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the invoice's own receivable line"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: invoice.id"],
            ["account_id.internal_type", "=", "receivable"],
          ]
        save_as: "move_line"
        limit: 1
        expect_count: 1
      - step: "Create usage for the voucher user, allocating the other partner's line"
        action: "create"
