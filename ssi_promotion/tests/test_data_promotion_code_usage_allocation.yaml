options:
  auto_refresh: true

scenarios:
  - name: "Approving an allocated usage reconciles its own accounting entry"
    steps:
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "ALLOC-S1-INC"
          name: "Allocation Basic Income"
          user_type_id: "REC: acc_type.id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Allocation Basic Journal"
          code: "ALLOCS1"
          type: "sale"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Allocation Basic Product"
          type: "service"
          property_account_income_id: "REC: income_account.id"
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Allocation Basic Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          account_id: "REC: income_account.id"
          discount_type: "fixed"
          discount_amount: 200000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Allocation Basic Customer"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "ALLOC-S1-001"
          type_id: "REC: ptype.id"
          # WAJIB: record rule promotion_code_internal_user_rule hanya
          # meloloskan pemiliknya sendiri (jebakan T-05).
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create a posted receivable invoice for the customer"
        action: "create"
        model: "account.move"
        save_as: "invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: customer.id"
          journal_id: "REC: journal.id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                quantity: 1
                price_unit: 1000000.0
                name: "Allocation Basic Invoice Line"
                account_id: "REC: income_account.id"
      - step: "Post the invoice"
        action: "call"
        target: "invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the invoice's own receivable line"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: invoice.id"],
            ["account_id.internal_type", "=", "receivable"],
          ]
        save_as: "move_line"
        limit: 1
        expect_count: 1
      - step: "Assert the receivable line's residual before allocation"
        action: "assert"
        target: "move_line"
        asserts:
          amount_residual:
            type: "value"
            expected: 1000000.0
      - step: "Create usage allocating the receivable line"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          # WAJIB: lihat catatan T-05 di atas.
          user_id: "REF: base.user_admin"
          allocation_ids:
            - - 0
              - 0
              - sequence: 10
                source: "customer"
                move_line_id: "REC: move_line.id"
      - step: "Assert fixed discount computed"
        action: "assert"
        target: "usage"
        asserts:
          discount_amount:
            type: "value"
            expected: 200000.0
      - step: "Confirm usage"
        action: "call"
        target: "usage"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh usage before approval (fresh policy field read)"
        action: "assert"
        target: "usage"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve usage"
        action: "call"
        target: "usage"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"
      - step: "Find the allocation row created for this usage"
        action: "search"
        model: "promotion_code_usage_allocation"
        domain: [["usage_id", "=", "REC: usage.id"]]
        save_as: "alloc_row"
        expect_count: 1
      - step: "Assert the allocation row was reconciled"
        action: "assert"
        target: "alloc_row"
        asserts:
          partial_reconcile_id:
            type: "value"
            operator: "is_truthy"
          amount_reconciled:
            type: "value"
            expected: 200000.0
      - step: "Assert the receivable line's residual dropped by the discount"
        action: "assert"
        target: "move_line"
        asserts:
          amount_residual:
            type: "value"
            expected: 800000.0

