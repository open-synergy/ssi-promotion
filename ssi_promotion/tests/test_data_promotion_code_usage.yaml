      - step: "Assert the referrer receivable line credits Discount Amount"
        action: "assert"
        target: "usage"
        asserts:
          referrer_receivable_move_line_id.debit:
            type: "value"
            expected: 0.0
          referrer_receivable_move_line_id.credit:
            type: "value"
            expected: 6000.0

  - name: "Cancelling an open usage deletes both accounting entries"
    steps:
      - step: "Get main company"
