options:
  auto_refresh: true

scenarios:
  - name: "Fixed discount usage approval creates customer accounting entry"
    steps:
      - step: "Get main company"
        action: "ref"
        xml_id: "base.main_company"
        save_as: "company"
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "PROMO-FIX"
          name: "Promotion Fixed Income"
          user_type_id: "EVAL: registry['acc_type'].id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Promotion Fixed Sales Journal"
          code: "PROMOFIX"
          type: "sale"
          company_id: "EVAL: registry['company'].id"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Promotion Fixed Product"
          type: "service"
          property_account_income_id: "EVAL: registry['income_account'].id"
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Fixed Discount Type"
          code: "/"
          discount_type: "fixed"
          discount_amount: 7000.0
          journal_id: "EVAL: registry['journal'].id"
          product_id: "EVAL: registry['product'].id"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "USAGE-FIX-001"
          type_id: "EVAL: registry['ptype'].id"
          # WAJIB: record rule promotion_code_internal_user_rule hanya
          # meloloskan pemiliknya sendiri; tanpa ini record mewarisi
          # superuser lewat _default_user_id() dan step ber-as_user di
          # bawah gagal AccessError begitu auto_refresh membacanya ulang
          # (jebakan T-05, skill odoo-development-unit-test).
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Fixed Discount Customer"
      - step: "Create a posted receivable invoice for the customer"
        action: "create"
        model: "account.move"
        save_as: "recv_invoice"
        values:
          move_type: "out_invoice"
          partner_id: "EVAL: registry['customer'].id"
          journal_id: "EVAL: registry['journal'].id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "EVAL: registry['product'].id"
                quantity: 1
                price_unit: 100000.0
                name: "Fixed Discount Allocation Line"
                account_id: "EVAL: registry['income_account'].id"
      - step: "Post the receivable invoice"
        action: "call"
        target: "recv_invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the receivable invoice's own receivable line"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: recv_invoice.id"],
            ["account_id.internal_type", "=", "receivable"],
          ]
        save_as: "recv_move_line"
        limit: 1
        expect_count: 1
      - step: "Create promotion code usage"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "EVAL: registry['code'].id"
          partner_id: "EVAL: registry['customer'].id"
          # WAJIB: lihat catatan T-05 pada "Create promotion code" di atas.
          user_id: "REF: base.user_admin"
          allocation_ids:
            - - 0
              - 0
              - sequence: 10
                source: "customer"
                move_line_id: "REC: recv_move_line.id"
      - step: "Assert fixed discount computed"
        action: "assert"
        target: "usage"
        asserts:
          discount_amount:
            type: "value"
            expected: 7000.0
      - step: "Confirm usage"
        action: "call"
        target: "usage"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh usage before approval (fresh policy field read)"
        action: "assert"
        target: "usage"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve usage"
        action: "call"
        target: "usage"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Assert customer accounting entry created"
        action: "assert"
        target: "usage"
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"
          referrer_move_id:
            type: "value"
            operator: "is_falsy"
      - step:
          "Assert customer accounting entry is a posted journal entry with its own
          receivable line"
        action: "assert"
        target: "usage"
        asserts:
          move_id.move_type:
            type: "value"
            expected: "entry"
          move_id.state:
            type: "value"
            expected: "posted"
          receivable_move_line_id:
            type: "value"
            operator: "is_truthy"
          receivable_move_line_id.account_id.internal_type:
            type: "value"
            expected: "receivable"
          receivable_move_line_id.debit:
            type: "value"
            expected: 0.0
          receivable_move_line_id.credit:
            type: "value"
            expected: 7000.0
          referrer_receivable_move_line_id:
            type: "value"
            operator: "is_falsy"
      - step: "Find every journal item of the customer accounting entry"
        action: "search"
        model: "account.move.line"
        domain: [["move_id", "=", "REC: usage.move_id.id"]]
        save_as: "fix_move_lines"
        expect_count: 2
      - step: "Find the customer accounting entry's own discount line"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: usage.move_id.id"],
            ["account_id.internal_type", "!=", "receivable"],
          ]
        save_as: "fix_discount_line"
        limit: 1
        expect_count: 1
      - step: "Assert the discount line debits Discount Amount"
        action: "assert"
        target: "fix_discount_line"
        asserts:
          debit:
            type: "value"
            expected: 7000.0
          credit:
            type: "value"
            expected: 0.0

  - name: "Percentage discount computed from reference document total"
    steps:
      - step: "Get main company"
        action: "ref"
        xml_id: "base.main_company"
        save_as: "company"
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "PROMO-PCT"
          name: "Promotion Percentage Income"
          user_type_id: "EVAL: registry['acc_type'].id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Promotion Percentage Sales Journal"
          code: "PROMOPCT"
          type: "sale"
          company_id: "EVAL: registry['company'].id"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Promotion Percentage Product"
          type: "service"
          property_account_income_id: "EVAL: registry['income_account'].id"
      - step: "Find account.move model"
        action: "search"
        model: "ir.model"
        domain: [["model", "=", "account.move"]]
        save_as: "model_account_move"
        limit: 1
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Percentage Discount Type"
          code: "/"
          discount_type: "percentage"
          discount_percentage: 10.0
          journal_id: "EVAL: registry['journal'].id"
          product_id: "EVAL: registry['product'].id"
          allowed_model_ids:
            - - 6
              - 0
              - - "EVAL: registry['model_account_move'].id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Percentage Discount Customer"
      - step: "Create reference invoice"
        action: "create"
        model: "account.move"
        save_as: "ref_invoice"
        values:
          move_type: "out_invoice"
          partner_id: "EVAL: registry['customer'].id"
          journal_id: "EVAL: registry['journal'].id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "EVAL: registry['product'].id"
                quantity: 1
                price_unit: 1000000.0
                name: "Reference Line"
                account_id: "EVAL: registry['income_account'].id"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "USAGE-PCT-001"
          type_id: "EVAL: registry['ptype'].id"
          # WAJIB: lihat catatan T-05 pada skenario "Fixed discount usage
          # approval creates customer accounting entry" di atas.
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
      - step: "Create promotion code usage referencing invoice"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "EVAL: registry['code'].id"
          partner_id: "EVAL: registry['customer'].id"
          document_reference: "EVAL: 'account.move,%d' % registry['ref_invoice'].id"
      - step: "Assert percentage discount computed"
        action: "assert"
        target: "usage"
        asserts:
          discount_amount:
            type: "value"
            expected: 100000.0

