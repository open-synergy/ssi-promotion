options:
  auto_refresh: true

scenarios:
  - name: "Fixed discount usage approval creates customer credit note"
    steps:
      - step: "Get main company"
        action: "ref"
        xml_id: "base.main_company"
        save_as: "company"
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "PROMO-FIX"
          name: "Promotion Fixed Income"
          user_type_id: "EVAL: registry['acc_type'].id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Promotion Fixed Sales Journal"
          code: "PROMOFIX"
          type: "sale"
          company_id: "EVAL: registry['company'].id"
      - step: "Create credit note product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Promotion Fixed Product"
          type: "service"
          property_account_income_id: "EVAL: registry['income_account'].id"
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Fixed Discount Type"
          code: "/"
          discount_type: "fixed"
          discount_amount: 7000.0
          journal_id: "EVAL: registry['journal'].id"
          product_id: "EVAL: registry['product'].id"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "USAGE-FIX-001"
          type_id: "EVAL: registry['ptype'].id"
          # WAJIB: record rule promotion_code_internal_user_rule hanya
          # meloloskan pemiliknya sendiri; tanpa ini record mewarisi
          # superuser lewat _default_user_id() dan step ber-as_user di
          # bawah gagal AccessError begitu auto_refresh membacanya ulang
          # (jebakan T-05, skill odoo-development-unit-test).
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Fixed Discount Customer"
      - step: "Create promotion code usage"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "EVAL: registry['code'].id"
          partner_id: "EVAL: registry['customer'].id"
          # WAJIB: lihat catatan T-05 pada "Create promotion code" di atas.
          user_id: "REF: base.user_admin"
      - step: "Assert fixed discount computed"
        action: "assert"
        target: "usage"
        asserts:
          discount_amount:
            type: "value"
            expected: 7000.0
      - step: "Confirm usage"
        action: "call"
        target: "usage"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh usage before approval (fresh policy field read)"
        action: "assert"
        target: "usage"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve usage"
        action: "call"
        target: "usage"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Assert customer credit note created"
        action: "assert"
        target: "usage"
        asserts:
          credit_note_id:
            type: "value"
            operator: "is_truthy"
          referrer_credit_note_id:
            type: "value"
            operator: "is_falsy"
      - step: "Assert customer credit note is posted with its receivable line"
        action: "assert"
        target: "usage"
        asserts:
          credit_note_id.state:
            type: "value"
            expected: "posted"
          credit_note_move_line_id:
            type: "value"
            operator: "is_truthy"
          credit_note_move_line_id.account_id.internal_type:
            type: "value"
            expected: "receivable"
          referrer_credit_note_move_line_id:
            type: "value"
            operator: "is_falsy"

  - name: "Percentage discount computed from reference document total"
    steps:
      - step: "Get main company"
        action: "ref"
        xml_id: "base.main_company"
        save_as: "company"
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "PROMO-PCT"
          name: "Promotion Percentage Income"
          user_type_id: "EVAL: registry['acc_type'].id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Promotion Percentage Sales Journal"
          code: "PROMOPCT"
          type: "sale"
          company_id: "EVAL: registry['company'].id"
      - step: "Create credit note product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Promotion Percentage Product"
          type: "service"
          property_account_income_id: "EVAL: registry['income_account'].id"
      - step: "Find account.move model"
        action: "search"
        model: "ir.model"
        domain: [["model", "=", "account.move"]]
        save_as: "model_account_move"
        limit: 1
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Percentage Discount Type"
          code: "/"
          discount_type: "percentage"
          discount_percentage: 10.0
          journal_id: "EVAL: registry['journal'].id"
          product_id: "EVAL: registry['product'].id"
          allowed_model_ids:
            - - 6
              - 0
              - - "EVAL: registry['model_account_move'].id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Percentage Discount Customer"
      - step: "Create reference invoice"
        action: "create"
        model: "account.move"
        save_as: "ref_invoice"
        values:
          move_type: "out_invoice"
          partner_id: "EVAL: registry['customer'].id"
          journal_id: "EVAL: registry['journal'].id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "EVAL: registry['product'].id"
                quantity: 1
                price_unit: 1000000.0
                name: "Reference Line"
                account_id: "EVAL: registry['income_account'].id"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "USAGE-PCT-001"
          type_id: "EVAL: registry['ptype'].id"
          # WAJIB: lihat catatan T-05 pada skenario "Fixed discount usage
          # approval creates customer credit note" di atas.
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
      - step: "Create promotion code usage referencing invoice"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "EVAL: registry['code'].id"
          partner_id: "EVAL: registry['customer'].id"
          document_reference: "EVAL: 'account.move,%d' % registry['ref_invoice'].id"
      - step: "Assert percentage discount computed"
        action: "assert"
        target: "usage"
        asserts:
          discount_amount:
            type: "value"
            expected: 100000.0

