        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          deferred_account_id: "REC: deferred_account.id"
          recognition_journal_id: "REC: journal.id"
          # WAJIB: lihat catatan T-05 pada "Create promotion code" di atas.
          user_id: "REF: base.user_admin"
      - step: "Assert each side kept its own discount amount"
        action: "assert"
        target: "usage"
        asserts:
          recognition_method:
            type: "value"
            expected: "deferred"
          discount_amount:
            type: "value"
            expected: 350000.0
          referrer_discount_amount:
            type: "value"
            expected: 150000.0
      - step: "Assert Amount To Recognize sums both sides instead of doubling one"
        action: "assert"
        target: "usage"
        asserts:
          amount_to_recognize:
            type: "value"
            expected: 500000.0
          amount_recognized:
            type: "value"
            expected: 0.0
          amount_deferred:
            type: "value"
            expected: 500000.0
          recognition_state:
            type: "value"
            expected: "pending"

