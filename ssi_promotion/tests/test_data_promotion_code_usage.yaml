        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Cancel Flow Customer"
      - step: "Create usage"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          # WAJIB: lihat catatan T-05 pada "Create promotion code" di atas.
          user_id: "REF: base.user_admin"
      - step: "Confirm usage"
