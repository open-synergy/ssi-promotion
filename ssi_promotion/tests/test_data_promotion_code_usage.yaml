        save_as: "code"
        values:
          voucher_code: "USAGE-A2R-001"
          type_id: "REC: ptype.id"
          partner_id: "REC: referrer.id"
          # WAJIB: lihat catatan T-05 pada skenario "Fixed discount usage
          # approval creates customer accounting entry" di atas.
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
