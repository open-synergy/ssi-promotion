        method: "action_approve_approval"
        as_user: "base.user_admin"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Referrer Discount No Allocation Customer"
      - step: "Create a posted receivable invoice for the customer"
        action: "create"
        model: "account.move"
        save_as: "recv_invoice"
        values:
          move_type: "out_invoice"
          partner_id: "EVAL: registry['customer'].id"
          journal_id: "EVAL: registry['journal'].id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "EVAL: registry['product'].id"
                quantity: 1
                price_unit: 1000000.0
                name: "Referrer Discount No Allocation Customer Line"
                account_id: "EVAL: registry['income_account'].id"
      - step: "Post the customer receivable invoice"
        action: "call"
        target: "recv_invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the customer invoice's own receivable line"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: recv_invoice.id"],
            ["account_id.internal_type", "=", "receivable"],
          ]
        save_as: "recv_move_line"
        limit: 1
        expect_count: 1
      - step: "Create promotion code usage with a customer allocation row only"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "EVAL: registry['code'].id"
          partner_id: "EVAL: registry['customer'].id"
          # WAJIB: lihat catatan T-05 pada "Create promotion code" di atas.
          user_id: "REF: base.user_admin"
          allocation_ids:
            - - 0
              - 0
              - sequence: 10
                source: "customer"
                move_line_id: "REC: recv_move_line.id"
      - step: "Assert the referrer amount is still computed even without an entry"
        action: "assert"
        target: "usage"
        asserts:
          discount_amount:
            type: "value"
            expected: 90000.0
          referrer_discount_amount:
            type: "value"
            expected: 30000.0
      - step: "Confirm usage"
        action: "call"
        target: "usage"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Refresh usage before approval (fresh policy field read)"
        action: "assert"
        target: "usage"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve usage"
        action: "call"
        target: "usage"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Assert only the customer accounting entry was issued"
        action: "assert"
        target: "usage"
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"
          move_id.state:
            type: "value"
            expected: "posted"
          move_id.amount_total:
            type: "value"
            expected: 90000.0
          referrer_move_id:
            type: "value"
            operator: "is_falsy"
          referrer_receivable_move_line_id:
            type: "value"
            operator: "is_falsy"

