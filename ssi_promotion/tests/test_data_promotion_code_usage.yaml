      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "PROMO-PCT"
          name: "Promotion Percentage Income"
          user_type_id: "EVAL: registry['acc_type'].id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Promotion Percentage Sales Journal"
          code: "PROMOPCT"
          type: "sale"
          company_id: "EVAL: registry['company'].id"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Promotion Percentage Product"
          type: "service"
          property_account_income_id: "EVAL: registry['income_account'].id"
      - step: "Find account.move model"
        action: "search"
        model: "ir.model"
        domain: [["model", "=", "account.move"]]
        save_as: "model_account_move"
        limit: 1
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Percentage Discount Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          account_id: "EVAL: registry['income_account'].id"
          discount_type: "percentage"
          discount_percentage: 10.0
          journal_id: "EVAL: registry['journal'].id"
          product_id: "EVAL: registry['product'].id"
          allowed_model_ids:
            - - 6
              - 0
              - - "EVAL: registry['model_account_move'].id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Percentage Discount Customer"
      - step: "Create reference invoice"
        action: "create"
        model: "account.move"
        save_as: "ref_invoice"
        values:
          move_type: "out_invoice"
          partner_id: "EVAL: registry['customer'].id"
          journal_id: "EVAL: registry['journal'].id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "EVAL: registry['product'].id"
                quantity: 1
                price_unit: 1000000.0
                name: "Reference Line"
                account_id: "EVAL: registry['income_account'].id"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "USAGE-PCT-001"
          type_id: "EVAL: registry['ptype'].id"
          # WAJIB: lihat catatan T-05 pada skenario "Fixed discount usage
          # approval creates customer accounting entry" di atas.
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
      - step: "Create promotion code usage referencing invoice"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "EVAL: registry['code'].id"
          partner_id: "EVAL: registry['customer'].id"
          document_reference: "EVAL: 'account.move,%d' % registry['ref_invoice'].id"
      - step: "Assert percentage discount computed"
        action: "assert"
        target: "usage"
        asserts:
          discount_amount:
            type: "value"
            expected: 100000.0

