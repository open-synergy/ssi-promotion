        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh usage before approval (fresh policy field read)"
        action: "assert"
        target: "usage"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve usage"
        action: "call"
        target: "usage"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Assert both credit notes exist and are posted before cancel"
        action: "assert"
        target: "usage"
        asserts:
          credit_note_id.state:
            type: "value"
            expected: "posted"
          referrer_credit_note_id.state:
            type: "value"
            expected: "posted"
      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "reason"
        values:
          name: "Usage Cancel Reason"
          code: "PCUCANCEL"
      - step: "Cancel the usage via the wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "usage"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"
      - step: "Assert both credit notes and their journal item fields are cleared"
        action: "assert"
        target: "usage"
        refresh: true
        asserts:
          credit_note_id:
            type: "value"
            operator: "is_falsy"
          referrer_credit_note_id:
            type: "value"
            operator: "is_falsy"
          credit_note_move_line_id:
            type: "value"
            operator: "is_falsy"
          referrer_credit_note_move_line_id:
            type: "value"
            operator: "is_falsy"

