  - name: "Replaying the accounting entry creation and posting hooks is idempotent"
    steps:
      - step: "Get main company"
        action: "ref"
        xml_id: "base.main_company"
        save_as: "company"
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "PROMO-GUARD"
          name: "Promotion Guard Income"
          user_type_id: "REC: acc_type.id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Promotion Guard Sales Journal"
          code: "PROMOGUARD"
          type: "sale"
          company_id: "REC: company.id"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Promotion Guard Product"
          type: "service"
          property_account_income_id: "REC: income_account.id"
      - step: "Create promotion type"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Guard Type"
          code: "/"
          discount_type: "fixed"
          discount_amount: 3000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "GUARD-001"
          type_id: "REC: ptype.id"
          # WAJIB: lihat catatan T-05 pada skenario "Fixed discount usage
          # approval creates customer accounting entry" di atas.
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Customer Guard"
      - step: "Create a posted receivable invoice for the customer"
        action: "create"
        model: "account.move"
        save_as: "recv_invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: customer.id"
          journal_id: "REC: journal.id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                quantity: 1
                price_unit: 100000.0
                name: "Customer Guard Allocation Line"
                account_id: "REC: income_account.id"
      - step: "Post the receivable invoice"
        action: "call"
        target: "recv_invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the receivable invoice's own receivable line"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: recv_invoice.id"],
            ["account_id.internal_type", "=", "receivable"],
          ]
        save_as: "recv_move_line"
        limit: 1
        expect_count: 1
      - step: "Create usage"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: customer.id"
          # WAJIB: lihat catatan T-05 pada "Create promotion code" di atas.
          user_id: "REF: base.user_admin"
          allocation_ids:
            - - 0
              - 0
              - sequence: 10
                source: "customer"
                move_line_id: "REC: recv_move_line.id"
      - step: "Confirm usage"
        action: "call"
        target: "usage"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh usage before approval (fresh policy field read)"
        action: "assert"
        target: "usage"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve usage"
        action: "call"
        target: "usage"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Assert customer accounting entry created"
        action: "assert"
        target: "usage"
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"
      - step: "Find the accounting entry before replay"
        action: "search"
        model: "account.move"
        domain: [["ref", "=", "REC: usage.name"], ["move_type", "=", "entry"]]
        save_as: "move_before"
        expect_count: 1
      - step: "Replay the accounting entry creation hook"
        action: "call"
        target: "usage"
        method: "_10_create_accounting_entry"
      - step: "Replaying must not create a second accounting entry"
        action: "search"
        model: "account.move"
        domain: [["ref", "=", "REC: usage.name"], ["move_type", "=", "entry"]]
        save_as: "move_after"
        expect_count: 1
      - step: "Assert move_id unchanged after replay"
        action: "assert"
        target: "usage"
        asserts:
          move_id:
            type: "m2o"
            expected: "REC: move_before"
          move_id.state:
            type: "value"
            expected: "posted"
      - step: "Capture the receivable line before replaying the post hook"
        action: "assert"
        target: "usage"
        asserts:
          receivable_move_line_id:
            type: "value"
            operator: "is_truthy"
      - step: "Replay the accounting entry posting hook"
        action: "call"
        target: "usage"
        method: "_20_post_accounting_entry"
      - step: "Assert move_id still posted and the line is unchanged"
        action: "assert"
        target: "usage"
        asserts:
          move_id.state:
            type: "value"
            expected: "posted"
          receivable_move_line_id:
            type: "value"
            operator: "is_truthy"
