options:
  auto_refresh: true

scenarios:
  - name: "An empty Apply Check Python Code applies the code exactly as before"
    steps:
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "APPCP1-INC"
          name: "Apply Python Empty Income"
          user_type_id: "REC: acc_type.id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Apply Python Empty Journal"
          code: "APPCP1"
          type: "sale"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Apply Python Empty Product"
          type: "service"
          property_account_income_id: "REC: income_account.id"
      - step: "Find account.move model"
        action: "search"
        model: "ir.model"
        domain: [["model", "=", "account.move"]]
        save_as: "account_move_model"
        limit: 1
        expect_count: 1
      - step: "Create promotion type with an empty Apply Check Python Code"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Apply Python Empty Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          account_id: "REC: income_account.id"
          discount_type: "fixed"
          discount_amount: 50000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
          apply_python_code: ""
          allowed_model_ids:
            - - 6
              - 0
              - - "REC: account_move_model.id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Apply Python Empty Customer"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "APPCP1-001"
          type_id: "REC: ptype.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create a posted receivable invoice for the customer"
        action: "create"
        model: "account.move"
        save_as: "invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: customer.id"
          journal_id: "REC: journal.id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                quantity: 1
                price_unit: 1000000.0
                name: "Apply Python Empty Invoice Line"
                account_id: "REC: income_account.id"
      - step: "Post the invoice"
        action: "call"
        target: "invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Run the Apply Promotion Code wizard from the invoice"
        action: "wizard"
        model: "apply_promotion_code"
        target: "invoice"
        as_user: "base.user_admin"
        values:
          promotion_code_id: "REC: code.id"
        method: "action_apply_promotion_code"
      - step: "Exactly one usage is created, as it was before this check existed"
        action: "search"
        model: "promotion_code_usage"
        domain: [["promotion_code_id", "=", "REC: code.id"]]
        save_as: "usage"
        expect_count: 1
      - step: "The usage is Draft and references the invoice"
        action: "assert"
        target: "usage"
        asserts:
          state:
            type: "value"
            expected: "draft"
          document_reference:
            type: "m2o"
            expected: "REC: invoice"

