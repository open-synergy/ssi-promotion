  - name: "A block branching on side rejects the referrer and lets the customer through"
    steps:
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "APPCP4-INC"
          name: "Apply Python Side Income"
          user_type_id: "REC: acc_type.id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Apply Python Side Journal"
          code: "APPCP4"
          type: "sale"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Apply Python Side Product"
          type: "service"
          property_account_income_id: "REC: income_account.id"
      - step: "Find account.move model"
        action: "search"
        model: "ir.model"
        domain: [["model", "=", "account.move"]]
        save_as: "account_move_model"
        limit: 1
        expect_count: 1
      - step: "Create promotion type whose block only rejects the referrer's own side"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Apply Python Side Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          account_id: "REC: income_account.id"
          discount_type: "fixed"
          discount_amount: 50000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
          apply_python_code: |
            result = side != "referrer"
            message = "The referrer's own side is closed for this type"
          allowed_model_ids:
            - - 6
              - 0
              - - "REC: account_move_model.id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Apply Python Side Customer"
      - step: "Create referrer partner"
        action: "create"
        model: "res.partner"
        save_as: "referrer"
        values:
          name: "Apply Python Side Referrer"
      - step: "Create promotion code owned by the referrer"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "APPCP4-001"
          type_id: "REC: ptype.id"
          user_id: "REF: base.user_admin"
          partner_id: "REC: referrer.id"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create a posted receivable invoice for the customer"
        action: "create"
        model: "account.move"
        save_as: "invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: customer.id"
          journal_id: "REC: journal.id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                quantity: 1
                price_unit: 1000000.0
                name: "Apply Python Side Customer Line"
                account_id: "REC: income_account.id"
      - step: "Post the customer's own invoice"
        action: "call"
        target: "invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create a posted receivable invoice for the referrer"
        action: "create"
        model: "account.move"
        save_as: "referrer_invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: referrer.id"
          journal_id: "REC: journal.id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                quantity: 1
                price_unit: 700000.0
                name: "Apply Python Side Referrer Line"
                account_id: "REC: income_account.id"
      - step: "Post the referrer's own invoice"
        action: "call"
        target: "referrer_invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "The voucher user's own side passes the very same block"
        action: "wizard"
        model: "apply_promotion_code"
        target: "invoice"
        as_user: "base.user_admin"
        values:
          promotion_code_id: "REC: code.id"
        method: "action_apply_promotion_code"
      - step: "Its Draft usage exists and is waiting for a referrer document"
        action: "search"
        model: "promotion_code_usage"
        domain: [["promotion_code_id", "=", "REC: code.id"]]
        save_as: "usage"
        expect_count: 1
      - step: "The referrer's own side over that same Draft usage is refused"
        action: "wizard"
        model: "apply_promotion_code"
        target: "referrer_invoice"
        as_user: "base.user_admin"
        values:
          promotion_code_id: "REC: code.id"
          side: "referrer"
        method: "action_apply_promotion_code"
        expect_error:
          type: "UserError"
          message_contains: "The referrer's own side is closed for this type"
      - step: "The refusal attached nothing to the Draft usage"
        action: "search"
        model: "promotion_code_usage"
        domain:
          [
            ["promotion_code_id", "=", "REC: code.id"],
            [
              "referrer_document_reference",
              "=",
              "EVAL: 'account.move,%d' % registry['referrer_invoice'].id",
            ],
          ]
        save_as: "attached_usages"
        expect_count: 0

  - name: "The block reads document, promotion_code, promotion_type and env"
    steps:
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "APPCP5-INC"
          name: "Apply Python Context Income"
          user_type_id: "REC: acc_type.id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Apply Python Context Journal"
          code: "APPCP5"
          type: "sale"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Apply Python Context Product"
          type: "service"
          property_account_income_id: "REC: income_account.id"
      - step: "Find account.move model"
        action: "search"
        model: "ir.model"
        domain: [["model", "=", "account.move"]]
        save_as: "account_move_model"
        limit: 1
        expect_count: 1
      - step: "Create promotion type whose block reads all four context names"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Apply Python Context Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          account_id: "REC: income_account.id"
          discount_type: "fixed"
          discount_amount: 50000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
          apply_python_code: |
            result = (
                bool(env.user)
                and document.partner_id.name == "Apply Python Context Customer"
                and promotion_code.name == "APPCP5-001"
                and promotion_type.discount_amount == 50000.0
            )
            message = "The context handed to the block was not what it expected"
          allowed_model_ids:
            - - 6
              - 0
              - - "REC: account_move_model.id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Apply Python Context Customer"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "APPCP5-001"
          type_id: "REC: ptype.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create a posted receivable invoice for the customer"
        action: "create"
        model: "account.move"
        save_as: "invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: customer.id"
          journal_id: "REC: journal.id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                quantity: 1
                price_unit: 1000000.0
                name: "Apply Python Context Invoice Line"
                account_id: "REC: income_account.id"
      - step: "Post the invoice"
        action: "call"
        target: "invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Every comparison holds, so the application goes through"
        action: "wizard"
        model: "apply_promotion_code"
        target: "invoice"
        as_user: "base.user_admin"
        values:
          promotion_code_id: "REC: code.id"
        method: "action_apply_promotion_code"
      - step: "Exactly one usage is created"
        action: "search"
        model: "promotion_code_usage"
        domain: [["promotion_code_id", "=", "REC: code.id"]]
        save_as: "usage"
        expect_count: 1
      - step: "Point the very same comparison at a code that is not this one"
        action: "write"
        target: "ptype"
        values:
          apply_python_code: |
            result = promotion_code.name == "APPCP5-SOMEBODY-ELSE"
            message = "The context handed to the block was not what it expected"
      - step: "Now the comparison fails, proving it really read promotion_code"
        action: "wizard"
        model: "apply_promotion_code"
        target: "invoice"
        as_user: "base.user_admin"
        values:
          promotion_code_id: "REC: code.id"
        method: "action_apply_promotion_code"
        expect_error:
          type: "UserError"
          message_contains: "The context handed to the block was not what it expected"
      - step: "The refusal created no second usage"
        action: "search"
        model: "promotion_code_usage"
        domain: [["promotion_code_id", "=", "REC: code.id"]]
        save_as: "usages_after"
        expect_count: 1

  - name: "A block that never assigns result is treated as allowing the application"
    steps:
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "acc_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "APPCP6-INC"
          name: "Apply Python Unset Income"
          user_type_id: "REC: acc_type.id"
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Apply Python Unset Journal"
          code: "APPCP6"
          type: "sale"
      - step: "Create discount product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Apply Python Unset Product"
          type: "service"
          property_account_income_id: "REC: income_account.id"
      - step: "Find account.move model"
        action: "search"
        model: "ir.model"
        domain: [["model", "=", "account.move"]]
        save_as: "account_move_model"
        limit: 1
        expect_count: 1
      - step: "Create promotion type whose block never assigns result"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Apply Python Unset Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          account_id: "REC: income_account.id"
          discount_type: "fixed"
          discount_amount: 50000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
          apply_python_code: |
            # Half-written configuration: nothing is assigned to result yet
            claimed = bool(document)
          allowed_model_ids:
            - - 6
              - 0
              - - "REC: account_move_model.id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Apply Python Unset Customer"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "APPCP6-001"
          type_id: "REC: ptype.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create a posted receivable invoice for the customer"
        action: "create"
        model: "account.move"
        save_as: "invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: customer.id"
          journal_id: "REC: journal.id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                quantity: 1
                price_unit: 1000000.0
                name: "Apply Python Unset Invoice Line"
                account_id: "REC: income_account.id"
      - step: "Post the invoice"
        action: "call"
        target: "invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "The application is allowed, not silently blocked"
        action: "wizard"
        model: "apply_promotion_code"
        target: "invoice"
        as_user: "base.user_admin"
        values:
          promotion_code_id: "REC: code.id"
        method: "action_apply_promotion_code"
      - step: "Exactly one usage is created"
        action: "search"
        model: "promotion_code_usage"
        domain: [["promotion_code_id", "=", "REC: code.id"]]
        save_as: "usage"
        expect_count: 1
