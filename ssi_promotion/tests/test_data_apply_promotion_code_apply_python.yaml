        save_as: "account_move_model"
        limit: 1
        expect_count: 1
      - step: "Create promotion type whose block rejects with its own sentence"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "Apply Python Message Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          account_id: "REC: income_account.id"
          discount_type: "fixed"
          discount_amount: 50000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
          apply_python_code: |
            result = False
            message = "This family has not claimed the code yet"
          allowed_model_ids:
            - - 6
              - 0
              - - "REC: account_move_model.id"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer"
        values:
          name: "Apply Python Message Customer"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          name: "APPCP2-001"
          type_id: "REC: ptype.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create a posted receivable invoice for the customer"
        action: "create"
        model: "account.move"
        save_as: "invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: customer.id"
          journal_id: "REC: journal.id"
          invoice_line_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                quantity: 1
                price_unit: 1000000.0
                name: "Apply Python Message Invoice Line"
                account_id: "REC: income_account.id"
      - step: "Post the invoice"
        action: "call"
        target: "invoice"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "The wizard is refused, and the configured sentence is the reason"
        action: "wizard"
        model: "apply_promotion_code"
        target: "invoice"
        as_user: "base.user_admin"
        values:
          promotion_code_id: "REC: code.id"
        method: "action_apply_promotion_code"
        expect_error:
          type: "UserError"
          message_contains: "This family has not claimed the code yet"
      - step: "No usage was created by the refused application"
        action: "search"
        model: "promotion_code_usage"
        domain: [["promotion_code_id", "=", "REC: code.id"]]
        save_as: "usages"
        expect_count: 0

