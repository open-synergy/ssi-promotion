      - step: "Create a recognition while the usage is still deferred"
        action: "create"
        model: "promotion_code_usage_recognition"
        save_as: "recognition_losing"
        values:
          usage_id: "REC: usage_losing.id"
          date: 2024-11-10
          # Nol, supaya _check_amount_not_exceed_to_recognize tidak
          # menyalip guard yang justru sedang diuji: begitu usage-nya
          # kehilangan sisi tertangguh, Amount To Recognize jadi 0.
          amount: 0.0
          journal_id: "REC: journal6.id"
          user_id: "REF: base.user_admin"
