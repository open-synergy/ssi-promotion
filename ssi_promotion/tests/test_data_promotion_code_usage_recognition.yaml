      - step: "Approve promotion code"
        action: "call"
        target: "code4"
        method: "action_approve_approval"
        as_user: "base.user_admin"
      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "customer4"
        values:
          name: "Recognition Mixed Side Customer"
      - step: "Create the mixed-side promotion code usage"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage_mixed"
        values:
          promotion_code_id: "REC: code4.id"
          partner_id: "REC: customer4.id"
          date: 2024-09-01
          referrer_deferred_account_id: "REC: referrer_deferred_account4.id"
          referrer_recognition_journal_id: "REC: journal4.id"
          recognition_journal_id: "REC: journal4.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm usage"
        action: "call"
        target: "usage_mixed"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve usage"
        action: "call"
        target: "usage_mixed"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step:
          "Assert only the referrer side is waiting to be recognized -- Recognition
          State reads Pending from the amounts, not Not Applicable from the voucher
          user's own Immediate method"
        action: "assert"
        target: "usage_mixed"
        asserts:
          amount_to_recognize:
            type: "value"
            expected: 90000.0
          amount_deferred:
            type: "value"
            expected: 90000.0
          recognition_state:
            type: "value"
            expected: "pending"
      - step: "Create the full recognition of the referrer side"
        action: "create"
        model: "promotion_code_usage_recognition"
        save_as: "recognition_mixed"
        values:
          usage_id: "REC: usage_mixed.id"
          date: 2024-09-10
          amount: 90000.0
          journal_id: "REC: journal4.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm the recognition"
        action: "call"
        target: "recognition_mixed"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve the recognition -- a single Line is issued, not two"
        action: "call"
        target: "recognition_mixed"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"
          recognition_line_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
      - step: "The Immediate voucher user side issues no Line at all"
        action: "search"
        model: "promotion_code_usage_recognition_line"
        domain:
          [
            ["recognition_id", "=", "REC: recognition_mixed.id"],
            ["line_type", "=", "customer"],
          ]
        save_as: "mixed_customer_lines"
        expect_count: 0
      - step: "Find the recognition's own referrer line"
        action: "search"
        model: "promotion_code_usage_recognition_line"
        domain:
          [
            ["recognition_id", "=", "REC: recognition_mixed.id"],
            ["line_type", "=", "referrer"],
          ]
        save_as: "mixed_referrer_line"
        expect_count: 1
      - step:
          "Assert the referrer line releases the referrer amount alone, crediting back
          the very account that side debited"
        action: "assert"
        target: "mixed_referrer_line"
        asserts:
          amount:
            type: "value"
            expected: 90000.0
          # Sisi Referrer mendebit referrer_deferred_account_id saat
          # approval, jadi ia harus mengkredit akun itu juga -- bukan
          # deferred_account_id sisi Voucher User, yang pada usage
          # campuran justru kosong.
          credit_account_id.code:
            type: "value"
            expected: "PCUR-RDEF4"
          debit_account_id.code:
            type: "value"
            expected: "PCUR-INC4"
      - step:
          "Assert the usage's own Amount Deferred reached zero and it moved itself to
          Done"
        action: "assert"
        target: "usage_mixed"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"
          amount_recognized:
            type: "value"
            expected: 90000.0
          amount_deferred:
            type: "value"
            expected: 0.0

